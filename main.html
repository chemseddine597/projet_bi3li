<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bi3li — Platform</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    /* Extra styles for new features */
    .auth-gate { min-height: 100vh; display: grid; grid-template-columns: 480px 1fr; }
    @media (max-width:900px) { .auth-gate { grid-template-columns: 1fr; } .auth-visual { display:none; } }

    /* Field error animation */
    .field-error { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

    /* Pagination button hover */
    [data-pg]:hover { opacity: 0.8; }

    /* Sort headers */
    .sort-th { cursor: pointer; user-select: none; white-space: nowrap; }
    .sort-th:hover { color: var(--green); }
    .sort-arrow { font-style: normal; margin-left: 3px; }

    /* Profile hero responsive */
    @media (max-width:768px) {
      .profile-hero { flex-direction: column; }
      .profile-hero > div:last-child { flex-direction: row; justify-content: flex-start; }
    }

    /* Table responsive fix */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Cat pills scroll on mobile */
    .cat-pills { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
    @media (min-width: 600px) { .cat-pills { flex-wrap: wrap; } }
  </style>
</head>
<body>

  <!-- ========== AUTH GATE ========== -->
  <div id="authGate" class="auth-gate">
    <!-- Auth card (login or register — rendered by JS) -->
    <div class="auth-card" id="authCard">
      <!-- Filled by renderAuthPage() -->
    </div>

    <!-- Visual panel (always shown on desktop) -->
    <div class="auth-visual">
      <div class="av-headline">
        <h1>Buy &amp; Sell<br/><em>Used Items</em><br/>Easily.</h1>
        <p>12,000+ happy members · 2,400+ listings</p>
      </div>
      <div class="av-cards">
        <div class="av-card">📱<span>iPhone 13<br/><b>340$</b></span></div>
        <div class="av-card">👟<span>Air Max<br/><b>68$</b></span></div>
        <div class="av-card">🪑<span>Oak Chair<br/><b>90$</b></span></div>
        <div class="av-card">💻<span>MacBook M2<br/><b>1100$</b></span></div>
      </div>
    </div>
  </div>

  <!-- ========== APP SHELL ========== -->
  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="logo-icon"><img src="LOGOBI3.png" alt="Bi3li Logo"   style="width:240px;height:240px;" /></span>
        </div>
        <button class="sidebar-close" id="sidebarClose">✕</button>
      </div>
      <div class="sidebar-user" id="sidebarUser"></div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <a href="index.html" class="btn btn-outline btn-sm" style="display:block;text-align:center;margin-bottom:8px;">← Public Store</a>
        <button class="signout-btn" id="signOutBtn">Sign Out</button>
      </div>
    </aside>

    <div class="app-body">
      <header class="topbar">
        <button class="topbar-menu" id="topbarMenu">☰</button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <main class="main-content" id="mainContent"></main>
    </div>
  </div>

  <!-- ========== MODAL ========== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <button class="modal-close-btn" id="modalCloseBtn">✕</button>
      <div id="modalInner"></div>
    </div>
  </div>

  
  <!-- ========== TOAST ========== -->    
  <div class="toast-container" id="toastContainer"></div>

  <!-- Ani sgmt hadi  3ljl fichier jdid li criyitou 
  Dans main.html, remplacer <script src="data.js"> par <script src="api-client.js"> (Claude ) -->

  <script src="api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
